<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session Ended</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png" />
    <link rel="icon" href="/favicon_io/favicon.ico" />
    <link rel="manifest" href="/favicon_io/site.webmanifest" />
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <main class="container">
      <h1>Session Ended</h1>
      <p>Your session is over. Please disconnect from the WiFi and wait for the timer below to reach zero before reconnecting.</p>
      <p class="blocked-timer-label">Time remaining:</p>
      <p id="blocked-timer" class="blocked-timer">--:--</p>

      <section class="blocked-canvas-section">
        <canvas id="blocked-canvas-preview" class="blocked-canvas-preview" hidden></canvas>
        <p id="blocked-canvas-empty" class="blocked-canvas-empty">No saved drawing yet.</p>
        <button type="button" id="blocked-canvas-download" class="blocked-canvas-download" hidden>Download saved canvas</button>
      </section>
    </main>
    <script src="/js/lease.js"></script>
    <script type="module" src="/js/blocked-preview.js"></script>
  </body>
</html>
