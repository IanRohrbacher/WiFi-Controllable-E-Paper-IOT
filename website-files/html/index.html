<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Ink Controller</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png" />
    <link rel="icon" href="/favicon_io/favicon.ico" />
    <link rel="manifest" href="/favicon_io/site.webmanifest" />
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <main class="container">
      <h1>E-Ink Controller</h1>
      <p id="session-timer" class="session-timer"></p>

      <section class="bitmap-editor">
        <div class="bitmap-palette">
          <button type="button" data-bitmap-color="1" class="active">Black</button>
          <button type="button" data-bitmap-color="2">Red</button>
          <button type="button" data-bitmap-color="0">White</button>
        </div>
        <div class="bitmap-brush-controls">
          <label for="brush-size-slider">Brush size</label>
          <input type="range" id="brush-size-slider" min="1" max="360" value="1" />
          <input type="number" id="brush-size-input" min="1" max="360" value="1" />
        </div>
        <div class="bitmap-brush-controls">
          <label for="brush-opacity-slider">Opacity</label>
          <input type="range" id="brush-opacity-slider" min="0" max="100" value="100" />
          <input type="number" id="brush-opacity-input" min="0" max="100" value="100" />
          <select id="brush-style-select">
            <option value="solid">Solid</option>
            <option value="bayer">Dithered</option>
            <option value="checkerboard">Checkerboard</option>
            <option value="striped">Striped</option>
          </select>
          <span>Preview:</span>
          <canvas id="brush-preview-canvas" class="brush-preview-canvas" width="48" height="48"></canvas>
        </div>
        <canvas id="bitmap-canvas" class="bitmap-canvas"></canvas>
        <div class="bitmap-actions">
          <button type="button" id="bitmap-undo" disabled>Undo</button>
          <button type="button" id="bitmap-redo" disabled>Redo</button>
          <button type="button" id="bitmap-clear">Clear</button>
          <button type="button" id="bitmap-send">Send to display</button>
          <button type="button" id="bitmap-download">Download .eink</button>
          <button type="button" id="bitmap-upload-trigger">Load .eink</button>
          <input type="file" id="bitmap-upload-input" hidden />
        </div>
        <p id="bitmap-status" class="bitmap-status"></p>
      </section>
    </main>
    <script src="/js/lease.js"></script>
    <script type="module" src="/js/bitmap-editor.js"></script>
  </body>
</html>
